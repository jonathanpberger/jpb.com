---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <div class="post-date">{{ page.date | date: "%B %d, %Y" }}</div>
  
  {{ content }}
  
  {% if page.categories %}
  <div class="categories">
    Categories: {{ page.categories | join: ', ' }}
  </div>
  {% endif %}
</article>
